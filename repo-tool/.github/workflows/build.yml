name: Build

on:
  workflow_call:
    inputs:
      profile:
        description: 'Cargo profile to build: "debug" or "release"'
        type: string
        default: debug
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_LTO: true
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            host: x86_64-unknown-linux-gnu
            binary: repo
            artifact: repo-linux-x86_64

          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            host: x86_64-pc-windows-msvc
            binary: repo.exe
            artifact: repo-windows-x86_64.exe

          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            host: aarch64-apple-darwin
            binary: repo
            artifact: repo-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config cmake zlib1g-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config zlib
          echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ inputs.profile }}

      - name: Build
        run: cargo build --locked --profile ${{ inputs.profile }} --target ${{ matrix.target }}

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/${{ inputs.profile }}/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          ls -l dist

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.label }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
