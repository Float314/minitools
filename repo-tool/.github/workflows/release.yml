name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish binaries for, e.g. v0.1.0'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    uses: ./.github/workflows/build.yml
    with:
      profile: release

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: repo-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes "Automated build of \`$TAG\` for Windows, macOS and Ubuntu." \
            --verify-tag
